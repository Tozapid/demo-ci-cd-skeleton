name: terraform

# The CI and deployment of the demo projects (Hide-My-Email,
# inventory-serverless-aws, wiki-serverless-aws). Each of them calls this
# workflow from .github/workflows/terraform.yml; see README.md.
#
# It runs in the calling repository: checkout, vars, environments and the
# OIDC token are that repository's. AWS is reached with the OIDC token: the
# plan and apply jobs run in the environment demo and assume the role in the
# variable AWS_ROLE_ARN, which trusts only that environment of the calling
# repository. No AWS keys are stored.
#
# A pull request of the repository itself can get a preview, by hand
# (Actions → terraform → Run workflow, with its number): the stack once more,
# named <name>-pr<number>, with its own state. It goes when the pull request
# is merged or closed, by hand (the same run with "destroy"), or by the daily
# sweep: the previews of closed pull requests, those not deployed for
# PREVIEW_DAYS, and the state locks of runs that died.

on:
  workflow_call:
    inputs:
      preview:
        description: Number of the pull request whose preview a manual run deploys or destroys; empty deploys the branch over the site.
        type: string
        default: ""
      destroy:
        description: Destroy the preview of that pull request instead of deploying it.
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.16.3"
  STATE_KEY: ${{ github.event.repository.name }}/terraform.tfstate
  # The previews: their states sit under the project's state prefix, which
  # the deploy role may write, as <repository>/pr-<number>/terraform.tfstate.
  PREVIEW_PREFIX: ${{ github.event.repository.name }}/pr-
  # The sweep destroys a preview not deployed for this many days, and drops a
  # state lock older than this many hours.
  PREVIEW_DAYS: "7"
  LOCK_HOURS: "3"
  # The default of the variable name in variables.tf, the preview's prefix.
  NAME_DEFAULT: |
    import re
    match = re.search(r'variable\s+"name"\s*\{.*?default\s*=\s*"([^"]+)"', open("variables.tf").read(), re.S)
    if not match:
        raise SystemExit("variables.tf has no default for the variable name")
    print(match.group(1))
  # Writes comment.md into the comment of the preview on pull request NUMBER:
  # one comment, edited each time.
  PREVIEW_COMMENT: |
    id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
      --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- demo-preview -->"))) | .id' | head -1)
    if [ -n "$id" ]; then
      gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
    else
      gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F body=@comment.md >/dev/null
    fi

jobs:
  terraform:
    name: Terraform format and validate
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
      || (github.event_name == 'workflow_dispatch' && inputs.preview == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      # The site takes its version from the newest entry; the release job makes it a GitHub release.
      - name: CHANGELOG version
        run: |
          heading=$(grep -m1 '^## ' CHANGELOG.md || true)
          if ! printf '%s\n' "$heading" | grep -qE '^## v[0-9]+\.[0-9]+\.[0-9]+( — .+)?$'; then
            echo "::error file=CHANGELOG.md::The newest entry must start with '## vX.Y.Z', optionally followed by ' — ' and a date or a title; found: $heading"
            exit 1
          fi
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  lambda:
    name: Lambda tests
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
      || (github.event_name == 'workflow_dispatch' && inputs.preview == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Unit tests
        working-directory: lambda
        run: |
          pip install --quiet boto3
          # What the function takes from a Lambda layer (cryptography for the PGP signatures of Hide My Email).
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          python -m unittest discover -v -p '*_test.py'

  web:
    name: Frontend tests
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
      || (github.event_name == 'workflow_dispatch' && inputs.preview == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Some page tests run the Lambda rules next to the page's.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: for f in web/*.js $(ls cloudfront/*.js 2>/dev/null); do node --check "$f"; done
      # The runner image has Google Chrome; the interface tests drive it.
      - name: Tests
        run: |
          if [ ! -f tests/web/package.json ]; then
            echo "No page tests in this repository."
            exit 0
          fi
          cd tests/web
          npm ci
          CHROME_PATH="$(command -v google-chrome)"
          export CHROME_PATH
          npm test

  plan:
    name: Plan
    needs: [terraform, lambda, web]
    # Pull requests from forks get no token for the environment, so only this repository's branches are planned.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: demo
    # Optional: the bucket the site's access logs go to (variable access_logs_bucket of the stack); unset is none.
    env:
      TF_VAR_access_logs_bucket: ${{ vars.ACCESS_LOGS_BUCKET }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        run: |
          terraform plan -lock=false -no-color -out=tfplan | tee plan.txt
          { echo '### Plan'; echo '```'; grep -E '^(Plan:|No changes)|^  # ' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: [terraform, lambda, web]
    # A push deploys main; a manual run (Actions → terraform → Run workflow) deploys
    # the branch chosen there, over the same site, until main is deployed again.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.preview == '')
    runs-on: ubuntu-latest
    environment: demo
    # Every branch deploys the same stack: one apply at a time across branches.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    # Optional: the bucket the site's access logs go to (variable access_logs_bucket of the stack); unset is none.
    env:
      TF_VAR_access_logs_bucket: ${{ vars.ACCESS_LOGS_BUCKET }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          { echo "### Deploying \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7})"; echo '### Plan'; echo '```'; grep -E '^(Plan:|No changes)|^  # ' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # A plan that would destroy a bucket, the table or the user pool needs a person, not CI.
      - name: Refuse to destroy data
        run: |
          if grep -E '^  # aws_(s3_bucket|dynamodb_table|cognito_user_pool)\.[a-z_]+ (will be destroyed|must be replaced)' plan.txt; then
            echo "::error::The plan destroys or replaces a bucket, the table or the user pool. Apply it by hand after checking."
            exit 1
          fi
      - name: terraform apply
        run: terraform apply -no-color tfplan
      # site_url in the box inventory and the wiki, site_urls (one per domain) in Hide My Email.
      - name: Site address
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "> The site runs \`${GITHUB_REF_NAME}\`, not main. The next deploy of main replaces it." >> "$GITHUB_STEP_SUMMARY"
          fi
          terraform output -json | jq -r '(.site_url.value // empty), (.site_urls.value // [] | .[])' | sed 's/^/Site: /' >> "$GITHUB_STEP_SUMMARY"

  # The preview of a pull request, by hand: Run workflow with its number.
  # The code of its last push, as <name>-pr<number> (the deploy role may
  # touch everything named with the prefix name), with its own state; its
  # address, or the failure, in a comment on the pull request. Run it again
  # after new pushes. Only pull requests of this repository: a fork's code
  # would run with the role.
  preview:
    name: Preview
    if: github.event_name == 'workflow_dispatch' && inputs.preview != '' && !inputs.destroy
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: preview-${{ inputs.preview }}
      cancel-in-progress: false
    # The preview sends no access logs: they would show as one more site.
    env:
      TF_VAR_access_logs_bucket: ""
      NUMBER: ${{ inputs.preview }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: The pull request
        run: |
          case "$NUMBER" in ''|*[!0-9]*) echo "::error::preview is the number of a pull request, not '$NUMBER'"; exit 1;; esac
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER")
          if [ "$(jq -r .state <<<"$pr")" != open ]; then
            echo "::error::Pull request #$NUMBER is not open."
            exit 1
          fi
          if [ "$(jq -r .head.repo.full_name <<<"$pr")" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull request #$NUMBER comes from a fork: its code would run with the deploy role."
            exit 1
          fi
          echo "HEAD_SHA=$(jq -r .head.sha <<<"$pr")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: |
          echo "TF_VAR_name=$(python3 -c "$NAME_DEFAULT")-pr$NUMBER" >> "$GITHUB_ENV"
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$PREVIEW_PREFIX$NUMBER/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
      - name: terraform apply
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          { echo "### Preview \`$TF_VAR_name\` (#$NUMBER, ${HEAD_SHA::7})"; echo '```'; grep -E '^(Plan:|No changes)|^  # ' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          terraform apply -no-color tfplan
      - name: Comment the address
        run: |
          urls=$(terraform output -json | jq -r '(.site_url.value // empty), (.site_urls.value // [] | .[])')
          for url in $urls; do echo "Site: $url"; done >> "$GITHUB_STEP_SUMMARY"
          {
            echo '<!-- demo-preview -->'
            echo "**Preview** \`$TF_VAR_name\` of ${HEAD_SHA::7}:"
            echo
            for url in $urls; do echo "- $url"; done
            echo
            echo "Run the workflow with #$NUMBER again to update it. It goes when the pull request is merged or closed, or after $PREVIEW_DAYS days without a deploy. A new CloudFront distribution may take a few minutes to answer."
          } > comment.md
          bash -c "$PREVIEW_COMMENT"
      - name: Comment the failure
        if: failure()
        run: |
          printf '%s\n' '<!-- demo-preview -->' "**Preview** of #$NUMBER failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. What was made stays and goes with the pull request; run the workflow again to finish it." > comment.md
          bash -c "$PREVIEW_COMMENT"

  # Which previews to destroy: the one of a merged or closed pull request,
  # the one asked for by hand, or, daily, those of pull requests no longer
  # open and those not deployed for PREVIEW_DAYS. The sweep also drops the
  # state locks of runs that died (older than LOCK_HOURS), which would stop
  # every later run of their preview.
  preview-targets:
    name: Previews to destroy
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
      || (github.event_name == 'workflow_dispatch' && inputs.preview != '' && inputs.destroy)
    runs-on: ubuntu-latest
    environment: demo
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find them
        id: find
        env:
          CLOSED: ${{ github.event.pull_request.number }}
          ASKED: ${{ inputs.preview }}
        run: |
          now=$(date +%s)
          objects=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$PREVIEW_PREFIX" \
            --query 'Contents[].[Key, LastModified]' --output text | grep -v '^None' || true)
          targets='[]'
          add() { targets=$(jq -c --arg n "$1" --arg r "$2" '. + [{number: $n, reason: $r}]' <<<"$targets"); }
          while read -r key; do
            number=${key#"$PREVIEW_PREFIX"}
            number=${number%%/*}
            case "$number" in ''|*[!0-9]*) continue;; esac
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              lock=$(awk -v k="$key.tflock" '$1 == k {print $2}' <<<"$objects")
              if [ -n "$lock" ] && [ $(( (now - $(date -d "$lock" +%s)) / 3600 )) -ge "$LOCK_HOURS" ]; then
                aws s3 rm "s3://$BUCKET/$key.tflock"
                echo "- #$number: dropped a state lock of $lock" >> "$GITHUB_STEP_SUMMARY"
              fi
              # Only a pull request GitHub does not know is gone; any other error skips it until the next sweep.
              if ! state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .state 2>error.txt); then
                if grep -q 'HTTP 404' error.txt; then
                  state=gone
                else
                  echo "- #$number: skipped, $(head -1 error.txt)" >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
              fi
              written=$(awk -v k="$key" '$1 == k {print $2}' <<<"$objects")
              age=$(( (now - $(date -d "$written" +%s)) / 86400 ))
              if [ "$state" != open ]; then
                add "$number" "the pull request is $state"
              elif [ "$age" -ge "$PREVIEW_DAYS" ]; then
                add "$number" "not deployed for $age days"
              fi
            elif [ "$number" = "$CLOSED" ]; then
              add "$number" "the pull request was closed"
            elif [ "$number" = "$ASKED" ]; then
              add "$number" "asked for by hand"
            fi
          done < <(awk '$1 ~ /\/terraform\.tfstate$/ {print $1}' <<<"$objects")
          if [ "$targets" = '[]' ] && [ -n "$ASKED" ]; then
            echo "No preview of #$ASKED." >> "$GITHUB_STEP_SUMMARY"
          fi
          jq -r '.[] | "- #\(.number): \(.reason)"' <<<"$targets" >> "$GITHUB_STEP_SUMMARY"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  # Each preview found: terraform destroy with the code of its pull request's
  # last push, then its state. A resource kept from being destroyed
  # (prevent_destroy) is dropped from the state first when it lives only
  # there (random_*, tls_*, time_*), so nothing is left behind in AWS; any
  # other one stops the job, and the sweep tries again the next day. The
  # comment on the pull request says what happened.
  preview-destroy:
    name: Destroy preview
    needs: preview-targets
    if: needs.preview-targets.outputs.targets != '[]'
    runs-on: ubuntu-latest
    environment: demo
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.preview-targets.outputs.targets) }}
    concurrency:
      group: preview-${{ matrix.target.number }}
      cancel-in-progress: false
    env:
      TF_VAR_access_logs_bucket: ""
      NUMBER: ${{ matrix.target.number }}
      REASON: ${{ matrix.target.reason }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      # The head of a pull request stays fetchable after its branch is deleted.
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ matrix.target.number }}/head
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: |
          echo "TF_VAR_name=$(python3 -c "$NAME_DEFAULT")-pr$NUMBER" >> "$GITHUB_ENV"
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$PREVIEW_PREFIX$NUMBER/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
      - name: terraform destroy
        run: |
          for _ in 1 2 3 4 5; do
            if terraform plan -destroy -no-color -out=destroy.tfplan > plan.txt 2>&1; then
              break
            fi
            cat plan.txt
            held=$(grep -oE 'Resource [^ ]+ has lifecycle.prevent_destroy' plan.txt | awk '{print $2}' | sort -u)
            [ -n "$held" ] || exit 1
            for address in $held; do
              if ! printf '%s\n' "$address" | grep -qE '^(module\.[^.]+(\["[^"]*"\])?\.)*(random|tls|time)_[a-z_]+\.'; then
                echo "::error::$address is kept from being destroyed and is more than state; remove the preview $TF_VAR_name by hand."
                exit 1
              fi
              terraform state rm "$address"
            done
          done
          { echo "### Destroying preview \`$TF_VAR_name\`: $REASON"; echo '```'; grep -E '^(Plan:)|^  # ' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          terraform apply -no-color destroy.tfplan
      - name: Remove the state
        run: |
          aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/$PREVIEW_PREFIX$NUMBER/terraform.tfstate"
          aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/$PREVIEW_PREFIX$NUMBER/terraform.tfstate.tflock" || true
      - name: Comment
        run: |
          printf '%s\n' '<!-- demo-preview -->' "**Preview** \`$TF_VAR_name\` destroyed: $REASON." > comment.md
          bash -c "$PREVIEW_COMMENT"
      - name: Comment the failure
        if: failure()
        run: |
          printf '%s\n' '<!-- demo-preview -->' "**Preview** of #$NUMBER was not destroyed ($REASON): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. It still runs; the daily sweep tries again, or re-run the failed job." > comment.md
          bash -c "$PREVIEW_COMMENT"

  # After main is deployed, by a push or a manual run: the newest CHANGELOG
  # entry becomes a tag and a GitHub release, once. The sites compare their
  # version with these releases.
  release:
    name: Release
    needs: apply
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preview == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release the newest CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          heading=$(grep -m1 '^## ' CHANGELOG.md)
          version=$(printf '%s\n' "$heading" | grep -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' | cut -c4-)
          if [ -z "$version" ]; then
            echo "No version in the newest entry: $heading"
            exit 0
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is out already."
            exit 0
          fi
          # The entry without its heading, up to the next one.
          awk '/^## /{ if (seen) exit; seen = 1; next } seen' CHANGELOG.md > notes.md
          gh release create "$version" --target "$GITHUB_SHA" --title "${heading#\#\# }" --notes-file notes.md
          echo "Released [$version]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$version)" >> "$GITHUB_STEP_SUMMARY"
