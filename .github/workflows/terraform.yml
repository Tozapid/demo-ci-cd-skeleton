name: terraform

# The CI and deployment of the demo projects (Hide-My-Email,
# inventory-serverless-aws, wiki-serverless-aws). Each of them calls this
# workflow from .github/workflows/terraform.yml; see README.md.
#
# It runs in the calling repository: checkout, vars, environments and the
# OIDC token are that repository's. AWS is reached with the OIDC token: the
# plan and apply jobs run in the environment demo and assume the role in the
# variable AWS_ROLE_ARN, which trusts only that environment of the calling
# repository. No AWS keys are stored.

on:
  workflow_call:

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.16.3"
  STATE_KEY: ${{ github.event.repository.name }}/terraform.tfstate

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  lambda:
    name: Lambda tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Unit tests
        working-directory: lambda
        run: |
          pip install --quiet boto3
          python -m unittest discover -v -p '*_test.py'

  web:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Some page tests run the Lambda rules next to the page's.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for f in web/*.js $(ls cloudfront/*.js 2>/dev/null); do node --check "$f"; done
      # The runner image has Google Chrome; the interface tests drive it.
      - name: Tests
        run: |
          if [ ! -f tests/web/package.json ]; then
            echo "No page tests in this repository."
            exit 0
          fi
          cd tests/web
          npm ci
          CHROME_PATH="$(command -v google-chrome)"
          export CHROME_PATH
          npm test

  plan:
    name: Plan
    needs: [terraform, lambda, web]
    # Pull requests from forks get no token for the environment, so only this repository's branches are planned.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        run: |
          terraform plan -lock=false -no-color -out=tfplan | tee plan.txt
          { echo '### Plan'; echo '```'; grep -E '^(Plan:|No changes)|^  # ' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    needs: [terraform, lambda, web]
    # A push deploys main; a manual run (Actions → terraform → Run workflow) deploys
    # the branch chosen there, over the same site, until main is deployed again.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: demo
    # Every branch deploys the same stack: one apply at a time across branches.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ env.STATE_KEY }}"
          -backend-config="region=${{ env.AWS_REGION }}"
      - name: terraform plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          { echo "### Deploying \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7})"; echo '### Plan'; echo '```'; grep -E '^(Plan:|No changes)|^  # ' plan.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # A plan that would destroy a bucket, the table or the user pool needs a person, not CI.
      - name: Refuse to destroy data
        run: |
          if grep -E '^  # aws_(s3_bucket|dynamodb_table|cognito_user_pool)\.[a-z_]+ (will be destroyed|must be replaced)' plan.txt; then
            echo "::error::The plan destroys or replaces a bucket, the table or the user pool. Apply it by hand after checking."
            exit 1
          fi
      - name: terraform apply
        run: terraform apply -no-color tfplan
      # site_url in the box inventory and the wiki, site_urls (one per domain) in Hide My Email.
      - name: Site address
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "> The site runs \`${GITHUB_REF_NAME}\`, not main. The next deploy of main replaces it." >> "$GITHUB_STEP_SUMMARY"
          fi
          terraform output -json | jq -r '(.site_url.value // empty), (.site_urls.value // [] | .[])' | sed 's/^/Site: /' >> "$GITHUB_STEP_SUMMARY"
